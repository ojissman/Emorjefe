
name: Proton VPN Europe - Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  vpn-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check Proton configuration
        shell: pwsh
        env:
          PROTON_WG_CONFIG: ${{ secrets.PROTON_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROTON_WG_CONFIG)) {
            throw "PROTON_WG_CONFIG secret is missing."
          }

          if ($env:PROTON_WG_CONFIG -notmatch '\[Interface\]' -or
              $env:PROTON_WG_CONFIG -notmatch '\[Peer\]') {
            throw "Invalid WireGuard configuration."
          }

          Write-Host "Proton configuration detected successfully."

      - name: Download official WireGuard installer
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "wireguard-amd64.msi"

          $url = "https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi"

          Write-Host "Downloading WireGuard..."

          Invoke-WebRequest -Uri $url -OutFile $msi

          if (-not (Test-Path $msi)) {
            throw "WireGuard installer download failed."
          }

          $signature = Get-AuthenticodeSignature $msi

          if ($signature.Status -ne "Valid") {
            throw "WireGuard installer signature is invalid."
          }

          Write-Host "Installer signature verified."

          $result = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait -PassThru

          if ($result.ExitCode -notin @(0, 3010)) {
            throw "WireGuard installation failed. Exit code: $($result.ExitCode)"
          }

          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (-not (Test-Path $wg)) {
            throw "WireGuard executable was not found."
          }

          Write-Host "WireGuard installed successfully."

      - name: Verify WireGuard installation
        shell: pwsh
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $wgExe = "$env:ProgramFiles\WireGuard\wg.exe"

          if (-not (Test-Path $wg)) {
            throw "WireGuard application not found."
          }

          if (-not (Test-Path $wgExe)) {
            throw "WireGuard command-line utility not found."
          }

          $version = (Get-Item $wg).VersionInfo.FileVersion

          Write-Host "WireGuard version: $version"
          Write-Host "WireGuard installation verified."
          Write-Host "VPN installation test PASSED."
