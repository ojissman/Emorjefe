
name: Proton VPN - WireGuard Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Validate Proton configuration
        shell: pwsh
        env:
          PROTON_WG_CONFIG: ${{ secrets.PROTON_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROTON_WG_CONFIG)) {
            throw "Missing Proton configuration."
          }

          if ($env:PROTON_WG_CONFIG -notmatch '\[Interface\]' -or
              $env:PROTON_WG_CONFIG -notmatch '\[Peer\]') {
            throw "Invalid WireGuard configuration."
          }

          Write-Host "Configuration sections detected."

          if ($env:PROTON_WG_CONFIG -match '(?im)^PrivateKey\s*=') {
            Write-Host "Private key field detected."
          } else {
            throw "Private key field missing."
          }

      - name: Install WireGuard
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "wireguard-amd64.msi"

          Invoke-WebRequest `
            -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi" `
            -OutFile $msi

          $signature = Get-AuthenticodeSignature $msi

          if ($signature.Status -ne "Valid") {
            throw "Invalid installer signature."
          }

          $result = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait -PassThru

          if ($result.ExitCode -notin @(0, 3010)) {
            throw "Installation failed: $($result.ExitCode)"
          }

          Write-Host "WireGuard installed."

      - name: Diagnose tunnel installation
        shell: pwsh
        env:
          PROTON_WG_CONFIG: ${{ secrets.PROTON_WG_CONFIG }}
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $configPath = Join-Path $env:RUNNER_TEMP "proton-eu.conf"

          Set-Content -Path $configPath `
            -Value $env:PROTON_WG_CONFIG.Trim() `
            -Encoding ascii

          Write-Host "WireGuard executable:"
          Write-Host $wg

          Write-Host "Checking configuration format..."

          $lines = Get-Content $configPath

          Write-Host "Configuration line count: $($lines.Count)"
          Write-Host "Interface section: $([bool]($lines -match '^\[Interface\]'))"
          Write-Host "Peer section: $([bool]($lines -match '^\[Peer\]'))"

          Write-Host "Attempting tunnel service installation..."

          & $wg /installtunnelservice $configPath 2>&1 |
            ForEach-Object { Write-Host $_ }

          $exitCode = $LASTEXITCODE

          Write-Host "WireGuard exit code: $exitCode"

          Write-Host "Checking tunnel services..."

          Get-Service -Name "WireGuardTunnel*" `
            -ErrorAction SilentlyContinue |
            Format-Table Name, Status

          Write-Host "Checking WireGuard service..."

          Get-Service -Name "WireGuardManager" `
            -ErrorAction SilentlyContinue |
            Format-Table Name, Status

          Write-Host "Checking recent service events..."

          Get-WinEvent -FilterHashtable @{
            LogName = "System"
            StartTime = (Get-Date).AddMinutes(-5)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProviderName -match "Service Control Manager"
            } |
            Select-Object -First 10 TimeCreated, Id, Message |
            Format-List

          Remove-Item $configPath -Force `
            -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            Write-Warning "Tunnel installation failed. Diagnostic information collected."
          } else {
            Write-Host "Tunnel installation succeeded."
          }
